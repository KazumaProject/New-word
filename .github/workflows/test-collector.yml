name: Test Issue and Release collectors
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - name: Verify the real pinned dictionaries and archive
        env:
          GH_TOKEN: ${{ github.token }}
          DICTIONARY_INDEX_PATH: ${{ runner.temp }}/new-word-dictionary.sqlite
        run: |
          python scripts/dictionary_assets.py --output "$DICTIONARY_INDEX_PATH"
          python scripts/collect_release_words.py --mode rebuild
          git diff --exit-code -- data/release
          python scripts/release_archive.py
