name: Monthly dictionary gaps

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collect: 未収録の名詞・名称を月次収集 / rebuild: 保存済みデータの再配布"
        type: choice
        options: [collect, rebuild]
        default: collect
  schedule:
    - cron: "0 19 1 * *"
      timezone: America/Toronto

permissions:
  contents: write

concurrency:
  group: daily-new-words
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'KazumaProject/New-word' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      COLLECTION_MODE: ${{ inputs.mode || 'collect' }}
      DICTIONARY_INDEX_PATH: .cache/dictionary.sqlite
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reading estimator
        run: python -m pip install -r requirements.txt
      - name: Test collectors and archive
        run: python -B -m unittest discover -s tests -v
      - name: Download and verify all 13 dictionary packs
        run: python scripts/dictionary_assets.py --output "$DICTIONARY_INDEX_PATH"
      - name: Collect Release candidates
        id: collect
        run: python scripts/collect_release_words.py --mode "$COLLECTION_MODE"
      - name: Commit canonical data and pending history before publication
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          python scripts/collect_release_words.py --mode rebuild
          git add -- data/release
          if git diff --cached --quiet -- data/release; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update cumulative Release words and pending candidates"
          git push
      - name: Build and validate one ZIP
        id: archive
        run: python scripts/release_archive.py
      - name: Preserve the validated ZIP and collection report
        if: always() && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-gaps-${{ github.run_id }}
          path: |
            dist/new-words.zip
            data/release/collection-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Update the single Release asset
        run: |
          if [ "$COLLECTION_MODE" = "rebuild" ]; then
            python scripts/publish_word_release.py --force
          else
            python scripts/publish_word_release.py
          fi
