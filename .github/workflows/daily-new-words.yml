name: Daily new words

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
      timezone: America/Toronto

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-new-words
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test collector
        run: python3 -B -m unittest discover -s tests -v

      - name: Collect new words
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_SEARCH_TOKEN: ${{ secrets.CODE_SEARCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/collect_new_words.py

      - name: Commit seen-word database
        run: |
          if git diff --quiet -- data/seen.tsv; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.tsv
          git commit -m "chore: update seen new words"
          git push
