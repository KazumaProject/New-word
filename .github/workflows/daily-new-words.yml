name: Daily new words

on:
  workflow_dispatch:
  schedule:
    # Toronto is UTC-4 during EDT and UTC-5 during EST.
    # Run at both possible UTC times; the script exits unless local time is 19:xx.
    - cron: "0 0,23 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-new-words
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect new words
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/collect_new_words.py

      - name: Commit seen-word database
        run: |
          if git diff --quiet -- data/seen.tsv; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.tsv
          git commit -m "chore: update seen new words"
          git push
