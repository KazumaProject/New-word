name: New words every 3 days

on:
  workflow_dispatch:
    inputs:
      refresh_readings:
        description: "既存Issueの読みだけを更新（新規収集なし）"
        type: boolean
        default: false
  schedule:
    # The calendar-day gate below keeps a true three-day interval across months.
    - cron: "0 19 * * *"
      timezone: America/Toronto

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-new-words
  cancel-in-progress: false

jobs:
  schedule:
    if: github.repository == 'KazumaProject/New-word' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check three-day interval
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "due=$(python3 scripts/collect_new_words.py --schedule-due)" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
  collect:
    needs: schedule
    if: needs.schedule.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DICTIONARY_INDEX_PATH: .cache/dictionary.sqlite
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install reading estimator
        run: python3 -m pip install -r requirements.txt

      - name: Test collector
        run: python3 -B -m unittest discover -s tests -v

      - name: Download and verify all 38 dictionary packs
        if: inputs.refresh_readings != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dictionary_assets.py --output "$DICTIONARY_INDEX_PATH"

      - name: Collect new words
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_SEARCH_TOKEN: ${{ secrets.CODE_SEARCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REFRESH_READINGS: ${{ inputs.refresh_readings }}
        run: |
          if [ "$REFRESH_READINGS" = "true" ]; then
            python3 scripts/collect_new_words.py --refresh-readings
          else
            python3 scripts/collect_new_words.py
          fi

      - name: Commit seen-word database
        run: |
          if git diff --quiet -- data/seen.tsv; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.tsv
          git commit -m "chore: update seen new words"
          git push
