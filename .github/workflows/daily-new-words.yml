name: Daily new words

on:
  workflow_dispatch:
    inputs:
      refresh_readings:
        description: "既存Issueの読みだけを更新（新規収集なし）"
        type: boolean
        default: false
  schedule:
    - cron: "0 19 * * *"
      timezone: America/Toronto

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-new-words
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install reading estimator
        run: python3 -m pip install -r requirements.txt

      - name: Test collector
        run: python3 -B -m unittest discover -s tests -v

      - name: Collect new words
        id: collect_words
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REFRESH_READINGS: ${{ inputs.refresh_readings }}
        run: |
          if [ "$REFRESH_READINGS" = "true" ]; then
            python3 scripts/collect_new_words.py --refresh-readings
          else
            python3 scripts/collect_new_words.py
          fi

      - name: Commit published history and pending queue
        if: always() && steps.collect_words.outcome != 'skipped'
        run: |
          git add -- data/seen.tsv
          if [ -f data/pending.json ]; then
            git add -- data/pending.json
          fi
          if git diff --cached --quiet -- data/seen.tsv data/pending.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update published words and pending candidates"
          git push
